name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -e .[dev,transformers]

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Check formatting with Ruff
        run: |
          ruff format --check src tests

      - name: Type check with Mypy
        run: |
          mypy src/amrs

      - name: Run tests with coverage
        env:
          # COVERAGE_MIN defaults to 0 until DM-1.1 merges, then 80
          COVERAGE_MIN: "80"
        run: |
          pytest -q --cov=amrs --cov-fail-under=$COVERAGE_MIN -m "not gpu and not slow and not e2e"

      - name: Security audit dependencies
        run: |
          pip-audit --desc on --local

      - name: Run CLI version check
        run: |
          amrs --version

      - name: Build Docker API image
        run: |
          docker build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu -t amrs-api:ci -f Dockerfile .
